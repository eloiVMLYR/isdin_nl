<!doctype html>
<html>
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  </head>
  <body
    style="
      margin: 0;
      padding: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    "
  >
    <table width="100%" cellpadding="0" cellspacing="0" border="0">
      <tr>
        <td align="center">
          <!-- CONTENIDOR -->
          <table
            width="600px"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="background: #ffffff"
          >
            <!-- HEADER -->
            <tr>
              <td style="padding: 12px 25px; background-color: #ffffff">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <!-- TEXT -->
                    <td valign="top">
                      <img
                        src="finastopic-isdin.png"
                        alt="Itragerm cápsulas duras"
                        style="display: block; border: 0; padding: 8px 0px"
                      />
                    </td>

                    <!-- LOGO -->
                    <td valign="top" align="right">
                      <img
                        src="isdin-logo.png"
                        alt="ISDIN"
                        style="display: block; border: 0"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- HERO -->
            <tr>
              <td
                style="background: #a6192e; color: #ffffff; padding: 15px 0px"
              >
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td style="background-color: #a6192e">
                      <p
                        style="
                          margin: 0;
                          color: #ffffff;
                          font-size: 33px;
                          line-height: 38px;
                          mso-line-height-rule: exactly;
                          text-align: center;
                        "
                      >
                        <b>Alopecia</b> y formulación magistral: Porque
                        <b>la base importa</b>
                      </p>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- DOCTOR -->
            <tr>
              <td style="">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td>
                      <a href="#">
                        <img
                          src="espejo.png"
                          width="100%"
                          style="
                            display: block;
                            border: 0;
                            line-height: 0;
                            font-size: 0;
                          "
                        />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <tr>
              <td style="padding: 15px; margin: 0">
                <p
                  style="
                    margin: 0;
                    padding: 0;
                    font-size: 19px;
                    line-height: 22px;
                    text-align: center;
                    color: #a6192e;
                  "
                >
                  En alopecia, a veces el resultado empieza en <br />
                  algo que no se ve:
                  <span style="font-weight: bold">la base de la fórmula</span>.
                </p>
              </td>
            </tr>

            <tr>
              <td
                align="center"
                style="font-size: 0; line-height: 0; padding: 0; margin: 0"
              >
                <a href="#" style="display: inline-block">
                  <img
                    src="hair-loss.png"
                    width="600"
                    style="
                      display: block;
                      border: 0;
                      width: 100%;
                      max-width: 600px;
                      height: auto;
                    "
                    alt=""
                  />
                </a>
              </td>
            </tr>

            <tr>
              <td
                align="center"
                style="font-size: 0; line-height: 0; padding: 0; margin: 0"
              >
                <img
                  src="tabla.png"
                  width="600"
                  style="
                    display: block;
                    border: 0;
                    width: 100%;
                    max-width: 600px;
                    height: auto;
                  "
                  alt=""
                />
              </td>
            </tr>

            <!-- FOOTER TEXT -->
            <tr>
              <td style="padding: 15px 25px 10px; background-color: #ffffff">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <!-- TEXT -->
                    <td
                      valign="top"
                      style="
                        color: #a6192e;
                        font-size: 12px;
                        font-family: Arial, sans-serif;
                        line-height: 1;
                        text-align: center;
                        font-weight: bold;
                      "
                    >
                      *Estabilidad química testada en el envase de Finastopic
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- FOOTER LOGO CENTRAT -->
            <tr>
              <td style="padding: 10px 25px 10px; background-color: #ffffff">
                <table width="100%" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <!-- LOGO -->
                    <td valign="top" align="right">
                      <img
                        src="isdin-logo.png"
                        alt="ISDIN"
                        style="display: block; border: 0"
                      />
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
